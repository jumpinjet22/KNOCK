[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knock"
version = "0.2.0"
description = "Local-first AI door answering platform foundation"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "KNOCK Contributors" }]
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "pydantic>=2.8.0,<3.0.0",
  "httpx>=0.27.0,<1.0.0",
  "wyoming>=1.5.0,<2.0.0",
  "paho-mqtt>=2.0.0,<3.0.0",
  "websockets>=13.0,<18.0",
  "uiprotect>=17.0.0,<18.0.0",
  "argon2-cffi>=23.1.0,<26.0.0",
  "starlette-csrf>=3.0.0,<4.0.0",
  "authlib>=1.3.0,<2.0.0",
  "itsdangerous>=2.1.0,<3.0.0",
  "webauthn>=2.5.0,<4.0.0",
  "Pillow>=10.0.0,<12.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "pytest-cov>=5.0.0,<8.0.0",
  "ruff>=0.6.0,<1.0.0",
  "respx>=0.21.0,<1.0.0",
  "mypy>=1.11.0,<3.0.0",
]

[project.scripts]
knock = "knock.cli.main:main"
knock-mqtt-bridge = "knock.integrations.mqtt:main"
knock-frigate-bridge = "knock.integrations.frigate:main"
knock-ha-bridge = "knock.integrations.homeassistant:main"
knock-unifi-bridge = "knock.integrations.unifi:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
knock = ["conversation/rules.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["knock"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["wyoming.*", "paho.*", "authlib.*"]
ignore_missing_imports = true
