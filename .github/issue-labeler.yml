# Maps the "Affected area" / "Area" dropdowns in the issue forms to labels.
# Each regex matches one exact dropdown option as an item in the
# comma-separated answer line GitHub renders into the issue body.
'area: core':
  - '(^|\n)([^\n]*, )?Core / orchestration(, [^\n]*)?(\r?\n|$)'
'area: safety':
  - '(^|\n)([^\n]*, )?Conversation & safety policy(, [^\n]*)?(\r?\n|$)'
'area: providers':
  - '(^|\n)([^\n]*, )?Providers \(LLM / STT / TTS / vision\)(, [^\n]*)?(\r?\n|$)'
'area: integrations':
  - '(^|\n)([^\n]*, )?Integrations \(doorbell / camera / intercom\)(, [^\n]*)?(\r?\n|$)'
  - '(^|\n)([^\n]*, )?Integrations / new hardware(, [^\n]*)?(\r?\n|$)'
'area: api':
  - '(^|\n)([^\n]*, )?API(, [^\n]*)?(\r?\n|$)'
'area: cli':
  - '(^|\n)([^\n]*, )?CLI(, [^\n]*)?(\r?\n|$)'
'area: web-ui':
  - '(^|\n)([^\n]*, )?Web UI(, [^\n]*)?(\r?\n|$)'
'area: docker':
  - '(^|\n)([^\n]*, )?Docker / deployment(, [^\n]*)?(\r?\n|$)'
'area: docs':
  - '(^|\n)([^\n]*, )?Docs(, [^\n]*)?(\r?\n|$)'
