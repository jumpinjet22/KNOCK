name: docker

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  # Weekly fresh rebuild of `edge`, so base-image/OS and in-range Python
  # package security fixes land even when nothing was merged that week.
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # PRs only build/validate the image; a version tag, a push to main,
      # the weekly schedule, or a manual workflow_dispatch run publishes it --
      # only those contexts have a usable GITHUB_TOKEN for registry writes
      # anyway.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # flavor's default `latest=auto` only tags `latest` for a stable
      # (non-prerelease) semver tag -- an alpha/beta/rc push (e.g.
      # v0.1.0-alpha) gets its own version tag only, so it can never
      # silently become what `docker pull ...:latest` resolves to.
      #
      # The semver rules only produce a tag when the ref is an actual git
      # tag -- a manual workflow_dispatch run on a branch matches neither,
      # so it'd otherwise produce zero tags and buildx would refuse to push
      # at all ("tag is needed when pushing to registry"). type=sha is the
      # fallback for that case; it's harmless additional noise on a real
      # tag push (that commit already gets its proper version tag(s) too).
      - name: Compute image tags/labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build image (push on a version tag or manual run only)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The weekly rebuild skips the layer cache and re-pulls the base
          # image -- otherwise an unchanged repo would be served entirely from
          # cache and never pick up new apt/pip packages.
          pull: ${{ github.event_name == 'schedule' }}
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
