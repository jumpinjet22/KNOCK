# Pins the compose project name regardless of the containing directory's
# name (this file lives under docker/, which would otherwise make the
# default project name "docker" and every resource it owns -- volumes,
# networks -- get a "docker_" prefix instead of "knock_").
name: knock

services:
  knock:
    container_name: knock
    restart: unless-stopped
    # Pinned to a specific build, not a floating tag -- this repo only
    # publishes `latest`/semver tags on an actual `vX.Y.Z` release tag (see
    # .github/workflows/docker-publish.yml); a manual/dispatch build only
    # ever gets a `sha-<short-sha>` tag. Bump this deliberately on upgrade.
    image: ghcr.io/jumpinjet22/knock:sha-57489a6
    env_file:
      # Same file (and the same KNOCK_<NAME>_<FIELD> vars) documented in
      # .env.example at the repo root -- copy that to .env and fill in your
      # real network endpoints. An env var here always wins over whatever's
      # stored through the web UI (see config.py's from_sources()
      # precedence), so this is how real deployments pin the connection
      # settings that matter (Ollama/Whisper/Kokoro/MQTT/Frigate/HA/UniFi)
      # without relying on the UI alone. Optional, matching .env.example's
      # own "nothing here is required" promise -- this still starts fine
      # with no .env present at all.
      - path: ../.env
        required: false
    ports:
      - "8080:8000"
    volumes:
      # Everything the web UI persists (config.json, auth.json,
      # web_sessions.json, passkeys.json, audit.jsonl, sessions/) lives here.
      # Without this volume, replacing the container (not just restarting
      # it) wipes all of it -- settings, the admin account, registered
      # passkeys, everything.
      - knock-data:/root/.local/share/knock

volumes:
  knock-data:
